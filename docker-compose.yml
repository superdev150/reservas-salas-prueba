services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://reservas:reservas@db:5432/reservas
      JWT_SECRET: dev-secret-cambiar-en-produccion
      APP_TIMEZONE: America/Tegucigalpa
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e:
    build: ./e2e
    profiles: ["e2e"]
    environment:
      BASE_URL: http://web
    volumes:
      - ./e2e/results:/e2e/results
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
